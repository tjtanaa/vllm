# ROCM_AITER_MLA per-rank shapes of moonshotai/Kimi-K3 at TP8 (12 heads, padded) and TP4 (24 heads).
# Shapes come from tests/v1/attention/model_shapes.py; CI stores the JSON
# output per commit and compares PRs with their merge base.
description: "ROCM_AITER_MLA vs TRITON_MLA, moonshotai/Kimi-K3 at TP8 (12 heads, padded) and TP4 (24 heads)"

model:
  name: "Kimi-K3"
  num_layers: 10
  num_q_heads: 12
  num_kv_heads: 1
  head_dim: 576
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128
  block_size: 16

# The per-rank head count picks the decode kernel (asm, padded asm, Gluon).
model_parameter_sweep:
  param_name: "num_q_heads"
  values: [24, 12]
  label_format: "{backend}_{value}h"

batch_specs:
  # Prefill: 2048 / 4096 / 8192 tokens
  - "q2k"
  - "q4k"
  - "q8k"
  # Decode: 1 / 16 / 128 requests x 2k / 4k / 8k context
  - "q1s2k"
  - "q1s8k"
  - "16q1s2k"
  - "16q1s4k"
  - "16q1s8k"
  - "128q1s2k"
  - "128q1s4k"
  - "128q1s8k"
  # Prefill with context (chunked prefill / prefix-cache hit)
  - "q512s4k"
  - "4q512s8k"
  # Speculative decode: MTP-1 and MTP-3 verify blocks
  - "16q2s4k"
  - "16q4s4k"
  - "128q4s2k"
  # Mixed
  - "2q2k_64q1s4k"
  - "q512s8k_16q1s4k_q1k"

backends:
  - ROCM_AITER_MLA
  - TRITON_MLA

kv_cache_dtype: auto
# MTP-3: verify blocks of up to 4 tokens run on the decode kernels.
num_speculative_tokens: 3
cuda_graphs: true
device: "cuda:0"
